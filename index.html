<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27none%27 stroke=%27%23a8263e%27 stroke-width=%276%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2730%27 text-anchor=%27middle%27 fill=%27%23a8263e%27%3E%ED%8C%90%3C/text%3E%3C/svg%3E">
<title>감옥저택의 번외재판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="『魔法少女ノ魔女裁判』 비공식 팬메이드 논리 퍼즐. 거짓말 사이에서 범인을 찾는다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
<style>
/* 레이아웃: 밤의 감옥 저택 예배당에서 열리는 재판. 위에서 스테인드글라스 빛이 번지는 어두운 기둥 하나에
   사건 → 피해자의 한마디(대사 상자) → 규칙 → 피고석 명패(수감 번호) → 히로의 수첩 → 판결 순으로 내려간다.
   원작의 그림·UI·로고는 쓰지 않는다(가이드라인 §7·§9). 분위기만 자작 CSS로 낸다. 한 가지 밤의 모습만 쓴다. */
:root {
  color-scheme: dark;
  --night: #0e0a12;        /* 바탕: 저택의 밤 */
  --panel: #18111d;        /* 패널 */
  --panel-2: #211826;      /* 명패 */
  --ink: #efe7ee;          /* 글자 */
  --muted: #a99bae;        /* 보조 글자 */
  --line: #3a2c41;         /* 선 */
  --blood: #b52d43;        /* 판결·회귀 바탕 */
  --blood-ink: #ef6a7e;    /* 판결·회귀 글자 */
  --wine: #33101a;         /* 붉은 칸 바탕 */
  --brass: #c9ab70;        /* 장식·마법 */
  --brass-dim: #261f15;    /* 마법 칸 바탕 */
  --ok: #86cfa5;           /* 정답 */
  --glass-blue: rgba(64, 104, 190, .20);
  --glass-amber: rgba(214, 132, 52, .12);
  --glass-wine: rgba(120, 20, 40, .28);
  --font-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --font-latin: "Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --r: 6px;
}

* { box-sizing: border-box; }
body {
  background:
    radial-gradient(56rem 34rem at 12% -8%, var(--glass-blue), transparent 62%),
    radial-gradient(48rem 30rem at 92% -6%, var(--glass-amber), transparent 62%),
    radial-gradient(70rem 50rem at 50% 115%, var(--glass-wine), transparent 70%),
    var(--night);
  background-color: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  min-height: 100%;
}
.wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
button, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--blood-ink); outline-offset: 2px; }
a { color: var(--blood-ink); }

/* 놋쇠 모서리 장식: 테두리를 가진 상자 중 일부(머리판·수첩·판결)에만 */
.frame { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); }
.frame::before, .frame::after {
  content: ""; position: absolute; width: 16px; height: 16px; border: 0 solid var(--brass); opacity: .75; pointer-events: none;
}
.frame::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; border-top-left-radius: var(--r); }
.frame::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; border-bottom-right-radius: var(--r); }

/* 머리 */
.masthead { display: grid; gap: 10px; padding-block: 8px 0; }
.masthead .eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--brass); }
.masthead h1 { font-size: clamp(38px, 9vw, 64px); line-height: 1.1; letter-spacing: .02em; }
.masthead h1 .mark { color: var(--blood-ink); }
.fleuron { color: var(--brass); font-size: 18px; letter-spacing: .6em; opacity: .8; }
.masthead p { margin: 0; color: var(--muted); max-width: 36em; }
.notice { padding: 14px 18px; font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
.notice b { color: var(--ink); font-weight: 700; }

/* 홈 */
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 28px; }
.section-title span { color: var(--muted); font-size: 14px; }
.daily, .random {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 18px 20px;
}
.daily { border-color: var(--blood); background: linear-gradient(180deg, var(--wine), var(--panel)); }
.daily .what, .random .what { min-width: 0; display: grid; gap: 2px; }
.daily .date { font-family: var(--font-latin); font-size: 16px; color: var(--brass); font-variant-numeric: tabular-nums; }
.daily h3, .random h3 { font-size: 24px; }
.random .what div { color: var(--muted); font-size: 14px; }
.tiers { display: grid; gap: 22px; }
.tier { display: grid; gap: 10px; }
.tier header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tier header h3 { font-size: 22px; }
.tier header small { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile {
  aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel);
  font-family: var(--font-latin); font-size: 22px; font-weight: 600; cursor: pointer; position: relative;
  font-variant-numeric: lining-nums tabular-nums;
}
.tile:hover { border-color: var(--brass); }
.tile.done { border-color: var(--blood); color: var(--blood-ink); }
.tile.done::after { content: "판"; position: absolute; right: 5px; bottom: 2px; font-family: var(--font-display); font-size: 11px; }
.tile.perfect { background: var(--blood); border-color: var(--blood); color: var(--ink); }

.btn {
  border: 1px solid var(--blood); background: var(--blood); color: var(--ink); border-radius: 999px;
  padding: 9px 20px; cursor: pointer; font-size: 15px;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .35; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--brass); }
.btn.rewind { background: transparent; color: var(--blood-ink); border-color: var(--blood); }

/* 사건 */
.case-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.case-top .where { color: var(--muted); font-size: 14px; }
.incident { font-size: clamp(26px, 5.6vw, 36px); line-height: 1.35; margin: 0; }

/* 대사 상자: 이름표 + 대사 (피해자의 한마디, 히로의 말) */
.dialog {
  margin: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px 14px; position: relative;
  background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(0, 0, 0, .25)), var(--panel);
}
.dialog .speaker {
  position: absolute; top: -13px; left: 14px; display: inline-flex; align-items: baseline; gap: 8px;
  background: var(--night); border: 1px solid var(--blood); border-radius: 4px; padding: 1px 10px;
  font-family: var(--font-display); font-size: 15px;
}
.no { font-family: var(--font-latin); font-style: italic; font-size: 15px; color: var(--brass); font-variant-numeric: lining-nums; }
.dialog blockquote { margin: 0; font-size: 17px; }
.say::before { content: "「"; color: var(--muted); }
.say::after { content: "」"; color: var(--muted); }
.say.written::before { content: "『"; }
.say.written::after { content: "』"; }

.rules { display: grid; gap: 10px; }
.rule { border-left: 2px solid var(--muted); padding: 2px 0 2px 14px; margin: 0; }
.rule strong { font-weight: 700; color: var(--blood-ink); }
.magic { background: var(--brass-dim); border: 1px solid rgba(201, 171, 112, .25); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 2px; }
.magic .tag { font-size: 12px; letter-spacing: .1em; color: var(--brass); }
.magic.hiro { background: var(--wine); border-color: rgba(181, 45, 67, .45); }
.magic.hiro .tag { color: var(--blood-ink); }

/* 피고석 명패 */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 16px 12px; display: grid; gap: 10px; min-width: 0;
  transition: border-color .15s, box-shadow .15s;
}
.card .plate { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.card .who { font-family: var(--font-display); font-size: 21px; }
.card .via { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 3px; }
.card blockquote { margin: 0; font-size: 17px; min-width: 0; }
.card.marked blockquote { text-decoration: line-through; text-decoration-color: var(--blood-ink); text-decoration-thickness: 2px; color: var(--muted); }
.card.accused { border-color: var(--blood); box-shadow: 0 0 0 1px var(--blood) inset, 0 0 24px rgba(181, 45, 67, .25); }
.card.cleared { opacity: .55; }
.card .hint { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px;
  font-size: 14px; cursor: pointer; color: var(--muted);
}
.chip:hover { border-color: var(--brass); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--blood); color: var(--ink); background: var(--wine); }
.chip:disabled { cursor: default; opacity: .7; }

/* 히로의 수첩 */
.notebook > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.notebook > summary::-webkit-details-marker { display: none; }
.notebook > summary::before { content: "＋"; color: var(--brass); width: 1em; }
.notebook[open] > summary::before { content: "－"; }
.nb-title { font-family: var(--font-display); font-size: 21px; }
.nb-sub { color: var(--muted); font-size: 13px; }
.nb-body { display: grid; gap: 12px; padding: 0 18px 18px; }
.nb-help { margin: 0; color: var(--muted); font-size: 14px; }
.grid-wrap { overflow-x: auto; }
table.hyp { border-collapse: collapse; font-size: 14px; }
table.hyp th { font-weight: 400; color: var(--muted); padding: 4px 6px; white-space: nowrap; }
table.hyp thead th { font-size: 13px; text-align: center; }
table.hyp tbody th, table.hyp tfoot th { text-align: left; color: var(--ink); }
table.hyp td { padding: 3px; text-align: center; }
.cell {
  width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 4px; background: var(--night);
  cursor: pointer; font-size: 17px; line-height: 1;
}
.cell:hover { border-color: var(--brass); }
@media (max-width: 440px) { .cell { width: 31px; } table.hyp th { padding: 4px 3px; } }
.cell.o { color: var(--ok); border-color: rgba(134, 207, 165, .5); }
.cell.x { color: var(--blood-ink); border-color: var(--blood); background: var(--wine); }
table.hyp tfoot td { font-family: var(--font-latin); font-size: 18px; font-weight: 600; color: var(--blood-ink); font-variant-numeric: tabular-nums; }
.nb-label { font-size: 14px; color: var(--muted); }
#memo-text {
  width: 100%; resize: vertical; min-height: 7em; background: var(--night); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 12px; line-height: 1.6;
}
.nb-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nb-actions .warn { color: var(--blood-ink); font-size: 14px; }

.tally { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* 판결 */
.verdict { padding: 20px; display: grid; gap: 12px; overflow: hidden; }
.verdict.right { border-color: var(--brass); }
.verdict.wrong { border-color: var(--blood); }
.verdict.rewind { border-style: dashed; }
.verdict h3 { font-size: 23px; }
.verdict.right h3 { padding-right: 88px; min-height: 60px; }
.verdict ul { margin: 0; padding-left: 18px; }
.verdict .morning { font-family: var(--font-display); font-size: 19px; color: var(--muted); }
.verdict .record { color: var(--muted); font-size: 14px; }
.verdict .dialog { margin-top: 10px; }
.stamp {
  position: absolute; right: 16px; top: 14px; width: 76px; height: 76px; border-radius: 50%;
  border: 3px double var(--blood-ink); color: var(--blood-ink); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 24px; transform: rotate(-12deg); opacity: .92;
  animation: stamp .35s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .92; } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .stamp, .shake { animation: none; } }

footer { color: var(--muted); font-size: 13px; display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>

<div class="wrap" id="app"></div>

<script src="puzzles.js"></script>
<script src="generator.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.PUZZLES;
  const GEN = window.SmallTrialGen;
  const TIER = { easy: "쉬움", normal: "보통", hard: "어려움", daily: "오늘의 재판" };
  const TIER_NOTE = {
    easy: "용의자 3~4명, 거짓말쟁이 1명. 마법 없음",
    normal: "마법 규칙이 하나 붙는다",
    hard: "용의자가 늘고, 말에 대한 말과 마법이 섞인다",
  };
  const HIRO_NO = 659;
  // 브라우저에만 남는 기록. 퍼즐 내용으로 만든 key 로 저장해서, 퍼즐을 다시 만들어도 엉뚱한 문제에 붙지 않는다.
  const DONE = "small-trial:done";        // { key: 최소 회귀 횟수 }
  const NOTE = "small-trial:note:";      // + key → { g: {"범인|카드": "o"|"x"}, t: 메모 }
  const UI = "small-trial:ui";           // { nb: 수첩 열림 }
  const app = document.getElementById("app");

  // 받침에 따라 조사를 고른다: josa("셰리", "을", "를") -> "셰리를"
  const josa = (w, a, b) => {
    const c = w.charCodeAt(w.length - 1);
    return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b);
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function load(k, fallback) {
    try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function save(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장이 막혀도 게임은 된다 */ }
  }
  // 예전 판(번호로 저장)은 다른 문제를 가리키므로 버린다
  try { localStorage.removeItem("small-trial:cleared"); localStorage.removeItem("small-trial:best"); } catch (e) { /* 없음 */ }

  let done = load(DONE, {});
  let ui = load(UI, { nb: false });
  const notesMem = {};
  const keyOf = (p) => p.key || p.id;
  function noteOf(p) {
    const k = keyOf(p);
    if (!notesMem[k]) notesMem[k] = load(NOTE + k, null) || { g: {}, t: "" };
    return notesMem[k];
  }
  function saveNote(p) { save(NOTE + keyOf(p), noteOf(p)); }

  function today() {
    const d = new Date();
    const days = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 0, 1)) / 86400000);
    const n = DATA.daily.length;
    return { label: `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}`, puzzle: DATA.daily[((days % n) + n) % n] };
  }

  let state = { view: "home" };

  function findPuzzle(id) {
    for (const t of Object.values(DATA.tiers)) for (const p of t) if (p.id === id) return p;
    return DATA.daily.find((p) => p.id === id);
  }

  // 무작위 재판은 (난이도, 번호)로 다시 만든다. 같은 번호면 같은 문제.
  let made = null;
  function randomPuzzle(r) {
    if (!made || made.tier !== r.tier || made.seed !== r.seed) made = GEN.make(r.tier, r.seed);
    return made;
  }
  const current = () => (state.random ? randomPuzzle(state.random) : findPuzzle(state.id));

  const fresh = () => ({ marks: [], culprit: null, solved: false, rewinds: 0, memory: [], verdict: null, confirmClear: false });

  function openPuzzle(p, fromDaily) {
    state = { view: "puzzle", id: p.id, daily: !!fromDaily, ...fresh() };
    render();
    window.scrollTo({ top: 0 });
  }

  function openRandom(tier) {
    let seed, p;
    for (let i = 0; i < 5 && !p; i++) { seed = 1 + Math.floor(Math.random() * 999999); p = randomPuzzle({ tier, seed }); }
    if (!p) return;     // 측정상 일어나지 않는다(난이도별 200개 표본에서 실패 0)
    state = { view: "puzzle", random: { tier, seed }, ...fresh() };
    render();
    window.scrollTo({ top: 0 });
  }

  // ---- 화면 ----

  function header() {
    return `
      <header class="masthead">
        <div class="eyebrow">마녀재판 비공식 팬메이드 · 논리 퍼즐</div>
        <h1>감옥저택의 <span class="mark">번외재판</span></h1>
        <div class="fleuron" aria-hidden="true">❦ ❦ ❦</div>
        <p>감옥 저택에서 '올바르지 않은' 일들이 일어나고 있다. 이를 바로잡는 건 바로 나, 니카이도 히로. 소녀들의 말 중 몇 개는 거짓이다. 말들이 모두 맞아 떨어지는 경우는 하나뿐이니, 그 경우의 범인을 찾아 판결하자.</p>
      </header>
      <div class="notice frame" role="note">
        <span><b>비공식 팬메이드</b> 작품이다. 공식 이미지·음성·텍스트는 쓰지 않았고, 사건과 대사는 전부 자작이다.</span>
        <span>제작에 AI(Claude)의 도움을 받았다.</span>
        <span>원작의 줄거리는 다루지 않지만, 캐릭터와 마법(히로의 마법 포함) 등 원작 설정이 나오므로 <b>스포일러에 주의</b>.</span>
        <span lang="ja">非公式のファンメイド作品・ネタバレあり・AI利用</span>
      </div>`;
  }

  function home() {
    const d = today();
    const tiers = ["easy", "normal", "hard"].map((t) => `
      <section class="tier" aria-label="${TIER[t]}">
        <header><h3>${TIER[t]}</h3><small>${TIER_NOTE[t]}</small></header>
        <div class="tiles">
          ${DATA.tiers[t].map((p, i) => {
            const k = keyOf(p);
            const has = k in done;
            return `<button class="tile ${has ? "done" : ""} ${done[k] === 0 ? "perfect" : ""}" data-open="${p.id}"
              aria-label="${TIER[t]} ${i + 1}번${has ? `, 판결 끝, 최소 회귀 ${done[k]}번` : ""}">${i + 1}</button>`;
          }).join("")}
        </div>
      </section>`).join("");
    app.innerHTML = header() + `
      <section class="daily" aria-label="오늘의 재판">
        <div class="what">
          <div class="date">${d.label} · ${TIER[d.puzzle.tier]}</div>
          <h3>오늘의 재판</h3>
          <div>${esc(d.puzzle.incident)}</div>
        </div>
        <button class="btn" data-daily="1">재판을 연다</button>
      </section>
      <section class="random" aria-label="무작위 재판">
        <div class="what">
          <h3>무작위 재판</h3>
          <div>누를 때마다 새 사건을 그 자리에서 만든다. 답이 하나뿐인지는 확인하지만, 재미와 난이도는 운에 맡긴다.</div>
        </div>
        <div class="bar">
          ${["easy", "normal", "hard"].map((t) => `<button class="btn ghost" data-random="${t}">${TIER[t]}</button>`).join("")}
        </div>
      </section>
      <div class="section-title"><h2>사건 기록</h2><span>판결을 끝낸 사건에는 도장이, 한 번도 돌아오지 않고 끝냈다면 붉게 찬 도장이 찍힌다</span></div>
      <div class="tiers">${tiers}</div>` + footer();
  }

  // 자기를 "나·저" 말고 다르게 부르는 사람이 있으면 알려 둔다(미리아 「아저씨」, 안안 「이 몸」, 노아 「노아」).
  function selfWords(p) {
    const V = (DATA.gen && DATA.gen.voices) || {};
    const items = p.suspects.filter((s) => V[s.id] && !["나", "저"].includes(V[s.id].self))
      .map((s) => `「${esc(V[s.id].self)}」(${esc(s.name)})`);
    return items.length ? `<p class="rule">자기를 부르는 말: ${items.join(" · ")}. 카드에 적힌 사람 자신을 가리킨다.</p>` : "";
  }

  // 히로가 범인을 제시하는 말: 「셰리, 네가 엎었어.」
  const accusation = (name, p) => `「${name}, 네가 ${p.verb}.」`;
  const nameOf = (p, id) => p.suspects.find((s) => s.id === id).name;

  function dialog(speaker, no, line, written) {
    return `
      <figure class="dialog">
        <figcaption class="speaker">${esc(speaker)}${no ? ` <span class="no">No.${no}</span>` : ""}${written ? " · 필담" : ""}</figcaption>
        <blockquote class="say ${written ? "written" : ""}">${esc(line)}</blockquote>
      </figure>`;
  }

  function notebook(p) {
    const note = noteOf(p);
    const ids = p.suspects.map((s) => s.id);
    const head = ids.map((c) => `<th scope="col">${esc(nameOf(p, c))}</th>`).join("");
    const rows = ids.map((r) => `
      <tr><th scope="row">${esc(nameOf(p, r))}의 말</th>${ids.map((c) => {
        const v = note.g[`${c}|${r}`] || "";
        const label = `${nameOf(p, c)}${josa(nameOf(p, c), "이", "가").slice(nameOf(p, c).length)} 범인이라면 ${nameOf(p, r)}의 말: ${v === "o" ? "맞음" : v === "x" ? "틀림" : "비어 있음"}`;
        return `<td><button class="cell ${v}" data-cell="${c}|${r}" data-k="cell:${c}|${r}" aria-label="${esc(label)}">${v === "o" ? "○" : v === "x" ? "×" : ""}</button></td>`;
      }).join("")}</tr>`).join("");
    const counts = ids.map((c) => {
      const x = ids.filter((r) => note.g[`${c}|${r}`] === "x").length;
      return `<td>${x || ""}</td>`;
    }).join("");
    return `
      <details class="notebook frame" id="notebook" ${ui.nb ? "open" : ""}>
        <summary><span class="nb-title">히로의 수첩</span><span class="nb-sub">가정 표와 메모. 이 브라우저에만 남는다</span></summary>
        <div class="nb-body">
          <p class="nb-help">열마다 "이 사람이 범인이라면"을 가정하고, 칸을 눌러 그때 각 카드의 말이 맞는지(○) 틀린지(×) 적는다. 맨 아래 줄에 × 수가 나온다.</p>
          <div class="grid-wrap">
            <table class="hyp">
              <thead><tr><th scope="col">범인이라면 →</th>${head}</tr></thead>
              <tbody>${rows}</tbody>
              <tfoot><tr><th scope="row">× 수</th>${counts}</tr></tfoot>
            </table>
          </div>
          <label class="nb-label" for="memo-text">메모</label>
          <textarea id="memo-text" rows="5" placeholder="예: 셰리가 범인이면 코코의 말은 틀린다. 그러면 거짓말쟁이는…"></textarea>
          <div class="nb-actions">
            <button class="btn ghost" data-clear-note="1" data-k="clear">${state.confirmClear ? "한 번 더 누르면 지운다" : "수첩 비우기"}</button>
            ${state.confirmClear ? `<span class="warn">이 문제의 가정 표와 메모가 지워진다.</span>` : ""}
          </div>
        </div>
      </details>`;
  }

  function puzzleView() {
    const p = current();
    const where = state.random ? `무작위 재판 · ${TIER[p.tier]} · 문제 번호 ${p.seed}`
      : state.daily ? `오늘의 재판 · ${TIER[p.tier]}` : `${TIER[p.tier]} ${DATA.tiers[p.tier].indexOf(p) + 1}번`;
    const cards = p.suspects.map((s) => {
      const marked = state.marks.includes(s.id);
      const accused = state.culprit === s.id;
      const known = state.memory.includes(s.id);
      return `
        <article class="card ${marked ? "marked" : ""} ${accused ? "accused" : ""} ${known ? "cleared" : ""}" data-card="${s.id}">
          <header class="plate">
            <span class="who">${esc(s.full || s.name)}${s.written ? `<span class="via">필담</span>` : ""}</span>
            ${s.no ? `<span class="no">No.${s.no}</span>` : ""}
          </header>
          <blockquote class="say ${s.written ? "written" : ""}">${esc(s.says)}</blockquote>
          <div class="acts">
            <button class="chip" data-mark="${s.id}" data-k="mark:${s.id}" aria-pressed="${marked}">틀린 말</button>
            <button class="chip" data-accuse="${s.id}" data-k="accuse:${s.id}" aria-pressed="${accused}" ${state.solved || known ? "disabled" : ""}>${known ? "범인 아님" : "범인으로 지목"}</button>
          </div>
          ${known ? `<div class="hint">회귀의 기억: ${esc(p.why_not[s.id])}</div>` : ""}
        </article>`;
    }).join("");
    const magic = p.magic.map((m) => `
      <div class="magic"><span class="tag">마법 규칙 · ${esc(m.who)}의 ${esc(m.name)}</span><span>${esc(m.text)}</span></div>`).join("");
    const culpritName = state.culprit ? nameOf(p, state.culprit) : null;
    const unknown = p.suspects.filter((s) => s.id !== p.answer && !state.memory.includes(s.id)).length;
    app.innerHTML = `
      <div class="case-top">
        <button class="btn ghost" data-home="1">사건 기록으로</button>
        <span class="where">${where}</span>
      </div>
      <h2 class="incident">${esc(p.incident)}</h2>
      ${p.victim ? dialog(p.victim.name, p.victim.no, p.victim.line, p.victim.written) : ""}
      <div class="rules">
        <p class="rule">이 중 딱 <strong>${p.n}명</strong>이 거짓말을 하고 있다. 거짓말쟁이의 말은 틀리고, 나머지의 말은 맞다.</p>
        <p class="rule">범인은 딱 한 명. 거짓말쟁이가 범인이라는 법은 없다.</p>
        ${selfWords(p)}
        <div class="magic hiro"><span class="tag">판결하는 사람 · 니카이도 히로의 사망 회귀</span>
          <span>판결이 틀리면 히로는 그날 아침으로 돌아간다. 돌아와도 기억은 남는다. 스스로 되감아서 범인이 아닌 사람 하나를 알아 올 수도 있다. 돌아온 횟수는 판결 기록에 남는다.</span></div>
        ${magic}
      </div>
      <div class="cards">${cards}</div>
      ${notebook(p)}
      <div class="bar">
        <button class="btn" data-judge="1" data-k="judge" ${!state.culprit || state.solved ? "disabled" : ""}>
          ${culpritName ? esc(accusation(culpritName, p)) : "범인을 고르면 판결할 수 있다"}</button>
        <button class="btn rewind" data-rewind="1" data-k="rewind" ${state.solved || unknown === 0 ? "disabled" : ""}>되감는다: 범인이 아닌 사람 하나를 알아 온다</button>
        <span class="tally">회귀 ${state.rewinds}번 · 틀린 말 표시 ${state.marks.length}개</span>
      </div>
      ${verdictView(p)}
      ${state.solved ? `<div class="bar"><button class="btn" data-next="1">${state.random ? "같은 난이도로 하나 더" : state.daily ? "사건 기록으로" : "다음 사건"}</button></div>` : ""}
      ` + footer();
    const memo = document.getElementById("memo-text");
    if (memo) memo.value = noteOf(p).t;
  }

  function verdictView(p) {
    const v = state.verdict;
    if (!v) return "";
    if (v.right) {
      const n = state.rewinds;
      return `
        <section class="verdict frame right" aria-live="polite">
          <div class="stamp" aria-hidden="true">판결</div>
          <h3>${esc(accusation(nameOf(p, p.answer), p))}</h3>
          <ul>${p.solution.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
          <div class="record">${n === 0 ? "한 번도 돌아오지 않고 판결했다." : `회귀 ${n}번 끝에 판결했다.`}</div>
          ${dialog("니카이도 히로", HIRO_NO, n === 0 ? "…올바른 판결이야. 틀린 건 틀렸다고 말해야지." : "몇 번을 돌아오든 상관없어. 올바른 판결에 닿았으면 그걸로 돼.")}
        </section>`;
    }
    if (v.rewind) {
      return `
        <section class="verdict frame rewind" aria-live="polite">
          <div class="morning">…눈을 뜨니 그날 아침이었다.</div>
          <div>회귀 ${state.rewinds}번째. ${esc(josa(nameOf(p, v.who), "은", "는"))} 범인이 아니다. 그건 기억하고 있다.</div>
          ${dialog("니카이도 히로", HIRO_NO, "알아낸 건 버리지 않아. 이번엔 틀리지 않아.")}
        </section>`;
    }
    return `
      <section class="verdict frame wrong shake" aria-live="polite">
        <h3>옳지 않은 판결이었다.</h3>
        <div>${esc(p.why_not[v.culprit])}</div>
        <div class="morning">…눈을 뜨니 그날 아침이었다.</div>
        <div class="record">회귀 ${state.rewinds}번째. 틀린 판결의 기억은 남아 있다.</div>
        ${dialog("니카이도 히로", HIRO_NO, "옳지 않은 건… 나였어. 다시 해.")}
      </section>`;
  }

  function footer() {
    return `
      <footer>
        <span>『魔法少女ノ魔女裁判』의 비공식 2차창작 팬게임 데모. 원작의 권리는 원작자에게 있다.</span>
        <span>퍼즐은 프로그램이 만든다. 사건 기록의 퍼즐은 답(범인)이 하나뿐인지 두 가지 방법으로 검산했고, 무작위 재판은 만들 때마다 전수 조사로 확인한다. 제작에 AI(Claude)의 도움을 받았다.</span>
      </footer>`;
  }

  // 다시 그려도 누르던 버튼에 초점을 돌려 둔다(키보드로 표를 채울 때 끊기지 않게)
  function render(focusKey) {
    if (state.view === "home") home();
    else puzzleView();
    if (focusKey) {
      const el = app.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
  }

  // ---- 조작 ----

  app.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const ds = b.dataset;
    if (ds.open) return openPuzzle(findPuzzle(ds.open), false);
    if (ds.daily) return openPuzzle(today().puzzle, true);
    if (ds.random) return openRandom(ds.random);
    if (ds.home) { state = { view: "home" }; render(); return; }
    const p = state.view === "puzzle" ? current() : null;
    if (!p) return;
    if (!ds.clearNote) state.confirmClear = false;
    if (ds.mark) {
      const i = state.marks.indexOf(ds.mark);
      if (i >= 0) state.marks.splice(i, 1); else state.marks.push(ds.mark);
    } else if (ds.accuse && !state.solved) {
      state.culprit = state.culprit === ds.accuse ? null : ds.accuse;
      if (state.verdict && !state.verdict.right) state.verdict = null;
    } else if (ds.cell) {
      const note = noteOf(p);
      const next = { "": "o", o: "x", x: "" }[note.g[ds.cell] || ""];
      if (next) note.g[ds.cell] = next; else delete note.g[ds.cell];
      saveNote(p);
    } else if (ds.clearNote) {
      if (!state.confirmClear) { state.confirmClear = true; }
      else { notesMem[keyOf(p)] = { g: {}, t: "" }; saveNote(p); state.confirmClear = false; }
    } else if (ds.judge && state.culprit && !state.solved) {
      if (state.culprit === p.answer) {
        state.solved = true;
        state.verdict = { right: true };
        if (!state.random) {
          const k = keyOf(p);
          if (!(k in done) || state.rewinds < done[k]) { done[k] = state.rewinds; save(DONE, done); }
        }
      } else {
        // 틀린 판결 = 사망 회귀. 지목한 사람이 범인이 아니라는 기억은 남는다
        state.rewinds += 1;
        state.memory.push(state.culprit);
        state.verdict = { right: false, culprit: state.culprit };
        state.culprit = null;
      }
    } else if (ds.rewind && !state.solved) {
      const left = p.suspects.filter((s) => s.id !== p.answer && !state.memory.includes(s.id));
      if (left.length) {
        const who = left[Math.floor(Math.random() * left.length)].id;
        state.rewinds += 1;
        state.memory.push(who);
        if (state.culprit === who) state.culprit = null;
        state.verdict = { rewind: true, who };
      }
    } else if (ds.next) {
      if (state.random) return openRandom(p.tier);
      if (state.daily) { state = { view: "home" }; render(); return; }
      const list = DATA.tiers[p.tier];
      const next = list[list.indexOf(p) + 1];
      if (next) return openPuzzle(next, false);
      state = { view: "home" }; render(); return;
    }
    render(ds.k);
  });

  // 메모는 쓰는 대로 저장한다(다시 그리지 않는다)
  app.addEventListener("input", (e) => {
    if (e.target.id !== "memo-text" || state.view !== "puzzle") return;
    const p = current();
    noteOf(p).t = e.target.value;
    saveNote(p);
  });
  // 수첩을 펼쳐 둔 상태는 기억한다
  app.addEventListener("toggle", (e) => {
    if (e.target.id !== "notebook") return;
    ui.nb = e.target.open;
    save(UI, ui);
  }, true);

  // 열려 있는 화면은 새 버전이 올라와도 이어서 보이게 한다(뷰어 전용 훅, 없으면 무시).
  try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) { /* 없음 */ }
  const start = (data) => {
    const s = data && data.state;
    if (s && s.view && (s.view === "home" || Array.isArray(s.memory))) state = { ...fresh(), ...s };
    render();
  };
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
